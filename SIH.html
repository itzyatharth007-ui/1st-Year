<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NER Landslide AI — Live Disaster Intelligence</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root{
  --bg:#06111d; --bg2:#091827; --card:rgba(12,28,45,.88); --card2:#10273c;
  --line:rgba(255,255,255,.09); --text:#eef6ff; --muted:#8ea5bb;
  --green:#00d6a0; --blue:#4ea1ff; --cyan:#20d5e8; --yellow:#ffbd43;
  --orange:#ff7a35; --red:#ff4d5f; --purple:#9b7cff;
  --shadow:0 18px 50px rgba(0,0,0,.30);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:Inter,Arial,sans-serif;color:var(--text);background:
  radial-gradient(circle at 80% -10%,rgba(0,214,160,.12),transparent 32%),
  radial-gradient(circle at 5% 40%,rgba(78,161,255,.09),transparent 30%),var(--bg);
  min-height:100vh;overflow-x:hidden
}
body.weather-rain{background:
  linear-gradient(rgba(5,16,28,.65),rgba(5,16,28,.82)),
  radial-gradient(circle at 70% 0%,#16405a,transparent 40%),#07131f}
body.weather-storm{background:
  linear-gradient(rgba(3,10,18,.72),rgba(3,10,18,.9)),
  radial-gradient(circle at 70% 0%,#3b344c,transparent 45%),#070d18}
body.weather-clear{background:
  radial-gradient(circle at 70% 0%,rgba(255,185,66,.15),transparent 35%),
  radial-gradient(circle at 10% 40%,rgba(0,214,160,.08),transparent 30%),#071521}
a{text-decoration:none;color:inherit}
button,input,select{font:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#20384f;border-radius:20px}

.sidebar{
 position:fixed;left:0;top:0;width:260px;height:100vh;z-index:1000;
 background:linear-gradient(180deg,#091a2b,#06111d 70%);border-right:1px solid var(--line);
 display:flex;flex-direction:column
}
.brand{padding:22px 18px;border-bottom:1px solid var(--line)}
.brand-row{display:flex;gap:12px;align-items:center}
.brand-icon{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
 background:linear-gradient(135deg,var(--green),var(--blue));box-shadow:0 10px 30px rgba(0,214,160,.2)}
.brand h2{font-size:14px;font-weight:800}.brand p{font-size:8px;color:var(--muted);letter-spacing:1.3px;margin-top:4px}
.nav{padding:15px 10px;overflow:auto;flex:1}
.label{font-size:9px;color:#587087;letter-spacing:1.5px;margin:16px 12px 8px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 13px;color:#9eb1c3;font-size:11px;border-radius:9px;margin-bottom:3px;transition:.2s}
.nav a:hover,.nav a.active{background:rgba(0,214,160,.08);color:var(--green)}
.nav a.active{border-left:3px solid var(--green)}
.nav i{width:18px;text-align:center}
.system{padding:15px;border-top:1px solid var(--line)}
.system-box{padding:12px;border-radius:10px;background:rgba(0,214,160,.06);border:1px solid rgba(0,214,160,.16);font-size:9px;color:#b5c7d8}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#18d989;box-shadow:0 0 12px #18d989;margin-right:6px}
.main{margin-left:260px;min-height:100vh}
.header{
 position:sticky;top:0;z-index:900;height:76px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;
 background:rgba(6,17,29,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)
}
.header h1{font-size:19px}.header p{font-size:10px;color:var(--muted);margin-top:5px}
.actions{display:flex;gap:9px;align-items:center}.live{padding:7px 11px;border-radius:20px;font-size:9px;color:var(--green);
background:rgba(0,214,160,.07);border:1px solid rgba(0,214,160,.18)}
.icon-btn,.btn{border:1px solid var(--line);background:#0d2032;color:#b9cada;border-radius:9px}
.icon-btn{width:37px;height:37px}.icon-btn:hover{border-color:var(--green);color:#fff}
.content{padding:28px;max-width:1800px;margin:auto}
.hero{
 position:relative;overflow:hidden;min-height:300px;padding:36px;border-radius:20px;
 background:linear-gradient(120deg,#0a3040,#0c2135 58%,#0a1828);border:1px solid rgba(0,214,160,.17);
 box-shadow:var(--shadow);margin-bottom:25px
}
.hero:before{content:"";position:absolute;width:600px;height:600px;right:-240px;top:-340px;border-radius:50%;
background:radial-gradient(circle,rgba(0,214,160,.24),transparent 68%)}
.hero:after{content:"";position:absolute;right:10%;bottom:-240px;width:420px;height:420px;border-radius:50%;
background:radial-gradient(circle,rgba(78,161,255,.18),transparent 68%)}
.hero-inner{position:relative;z-index:2;max-width:950px}
.badge,.tag{display:inline-flex;align-items:center;gap:7px;color:var(--green);font-size:9px;padding:7px 10px;
border-radius:20px;background:rgba(0,214,160,.08);border:1px solid rgba(0,214,160,.18)}
.hero h2{font-size:35px;line-height:1.2;margin:16px 0 12px}.hero p{max-width:900px;color:#a6bacd;font-size:12px;line-height:1.8}
.hero-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}
.btn{padding:10px 15px;font-size:10px;font-weight:700}.btn-primary{background:var(--green);color:#002219;border-color:var(--green)}
.btn-primary:hover{filter:brightness(1.08)}.btn-secondary:hover{border-color:var(--green);color:#fff}
.section{margin:0 0 28px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}
.section-head h2{font-size:16px}.section-head p{font-size:10px;color:var(--muted);margin-top:5px}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);transition:.2s}
.kpi:hover{transform:translateY(-3px);background:var(--card2)}
.kpi-top{display:flex;justify-content:space-between;align-items:center}.kpi-label{font-size:8px;color:#71879a}
.kpi-icon{width:35px;height:35px;border-radius:9px;display:grid;place-items:center}.g{color:var(--green);background:rgba(0,214,160,.1)}
.b{color:#6cb1ff;background:rgba(78,161,255,.1)}.r{color:#ff7785;background:rgba(255,77,95,.1)}
.y{color:#ffd16c;background:rgba(255,189,67,.1)}.p{color:#c2afff;background:rgba(155,124,255,.1)}
.c{color:#6de7f2;background:rgba(32,213,232,.1)}
.kpi h3{font-size:24px;margin-top:13px}.kpi small{font-size:8px;color:var(--muted)}.change{font-size:8px;margin-top:8px;color:var(--green)}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:var(--shadow)}
.card-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.card-head h3{font-size:12px}.card-head span{font-size:8px;color:var(--muted)}.card-body{padding:18px}
.grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:17px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.map-wrap{position:relative}.map{height:520px;border-radius:10px;overflow:hidden}.map-controls{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.map-btn{padding:7px 10px;border-radius:7px;border:1px solid var(--line);background:#0b1b2b;color:#8fa5b8;font-size:8px}
.map-btn.active{color:var(--green);border-color:rgba(0,214,160,.35);background:rgba(0,214,160,.08)}
.map-note{position:absolute;z-index:500;left:20px;bottom:20px;background:rgba(7,20,33,.93);padding:10px;border-radius:9px;font-size:8px;border:1px solid var(--line)}
.legend{display:flex;gap:10px;flex-wrap:wrap;color:#a8bacb}.legend span{font-size:8px}.legend i{width:8px;height:8px;display:inline-block;border-radius:50%;margin-right:4px}
.risk-panel{display:flex;gap:22px;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line)}
.risk-circle{width:155px;height:155px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none;
background:conic-gradient(var(--red) 0deg,var(--red) 250deg,#25394c 250deg)}
.risk-circle:before{content:"";position:absolute;width:120px;height:120px;border-radius:50%;background:#0e1d2e}
.risk-number{position:relative;text-align:center;z-index:2}.risk-number strong{font-size:37px;display:block}.risk-number small{font-size:8px;color:var(--muted)}
.risk-info h3{font-size:18px;margin-bottom:8px}.critical{color:#ff9da8;font-size:8px;padding:5px 8px;border-radius:5px;background:rgba(255,77,95,.1);border:1px solid rgba(255,77,95,.2)}
.risk-info p{color:var(--muted);font-size:9px;line-height:1.65;margin-top:10px}
.factor{margin-top:14px}.factor-head{display:flex;justify-content:space-between;font-size:9px;margin-bottom:6px}
.progress{height:7px;background:#1b2d40;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;border-radius:10px;transition:width .6s}
.rain{background:linear-gradient(90deg,#2876ff,#69b7ff)}.soil{background:linear-gradient(90deg,#9a4e12,#ffc044)}
.slope{background:linear-gradient(90deg,#6f39d5,#b5a0ff)}.move{background:linear-gradient(90deg,#00a2bf,#58ebf7)}
.seis{background:linear-gradient(90deg,#bd2727,#ff8390)}
.chart{height:300px;position:relative}.weather-card{min-height:370px;position:relative;overflow:hidden}
.weather-card:before{content:"";position:absolute;inset:0;opacity:.22;pointer-events:none}
.weather-card.rain-bg:before{background:repeating-linear-gradient(110deg,transparent 0 17px,rgba(120,190,255,.28) 18px 19px,transparent 20px 36px);animation:rain .8s linear infinite}
@keyframes rain{to{background-position:80px 120px}}
.weather-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}.temp{font-size:47px;font-weight:800}.condition{font-size:10px;color:var(--muted);margin-top:4px}
.weather-icon{font-size:58px;color:#78baff}.weather-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:22px;position:relative;z-index:1}
.weather-item{background:rgba(5,17,29,.48);border:1px solid var(--line);padding:12px;border-radius:9px;text-align:center}
.weather-item i{color:#6fb8ff;margin-bottom:8px}.weather-item strong{display:block;font-size:13px}.weather-item span{font-size:7px;color:var(--muted)}
.source-line{font-size:8px;color:#6e8498;margin-top:15px;position:relative;z-index:1}
.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse;font-size:9px}.data-table th{color:#6f8498;text-align:left;padding:11px;border-bottom:1px solid var(--line)}
.data-table td{padding:12px 11px;border-bottom:1px solid rgba(255,255,255,.035);color:#c4d0db}.state{font-weight:700;color:#fff}
.pill{display:inline-block;padding:4px 7px;border-radius:5px;font-size:7px}.low{color:#36e1a4;background:rgba(0,214,160,.1)}
.medium{color:#ffd06b;background:rgba(255,189,67,.1)}.high{color:#ff8995;background:rgba(255,77,95,.1)}
.sensor-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.sensor{padding:14px;border:1px solid var(--line);background:#0a1a2a;border-radius:10px}
.sensor-top{display:flex;justify-content:space-between}.sensor-name{font-size:9px;font-weight:700}.online{width:7px;height:7px;border-radius:50%;background:#19d98b;box-shadow:0 0 8px #19d98b}
.sensor-value{font-size:21px;font-weight:800;margin-top:10px}.sensor-unit{font-size:7px;color:var(--muted)}.sensor-meta{display:flex;justify-content:space-between;color:#647c91;font-size:7px;margin-top:10px}
.alert-list{display:flex;flex-direction:column;gap:9px}.alert{display:flex;gap:10px;padding:11px;border-radius:8px;border-left:3px solid}
.alert.red-a{background:rgba(255,77,95,.06);border-color:var(--red)}.alert.yellow-a{background:rgba(255,189,67,.06);border-color:var(--yellow)}
.alert.blue-a{background:rgba(78,161,255,.06);border-color:var(--blue)}.alert-icon{width:30px;height:30px;border-radius:7px;display:grid;place-items:center}
.alert h4{font-size:9px}.alert p{font-size:8px;color:var(--muted);line-height:1.5;margin-top:4px}.alert time{font-size:7px;color:#61758a;display:block;margin-top:5px}
.feature{padding:16px;border:1px solid var(--line);background:#0a1a2a;border-radius:11px}.feature i{font-size:19px;color:var(--green)}
.feature h4{font-size:10px;margin-top:10px}.feature p{font-size:8px;line-height:1.6;color:var(--muted);margin-top:5px}
.timeline{position:relative;padding-left:20px}.timeline:before{content:"";position:absolute;left:5px;top:0;bottom:0;width:1px;background:#294157}
.timeline-item{position:relative;margin-bottom:17px}.timeline-item:before{content:"";position:absolute;left:-19px;top:2px;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px rgba(0,214,160,.5)}
.timeline h4{font-size:9px}.timeline p{font-size:8px;line-height:1.5;color:var(--muted);margin-top:4px}.timeline span{font-size:7px;color:#60778d}
.pipeline{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;align-items:center}.step{padding:14px 7px;text-align:center;border:1px solid var(--line);background:#0a1a2a;border-radius:9px}
.step i{font-size:20px;color:var(--green)}.step h4{font-size:8px;margin-top:7px}.step p{font-size:6px;line-height:1.4;color:var(--muted);margin-top:4px}.arrow{text-align:center;color:#486179}
footer{border-top:1px solid var(--line);padding:22px 28px;color:#60778d;font-size:8px;display:flex;justify-content:space-between}
.toast{position:fixed;right:25px;bottom:25px;z-index:7000;padding:12px 15px;background:#10283d;border:1px solid rgba(0,214,160,.25);border-radius:9px;font-size:9px;transform:translateY(100px);opacity:0;transition:.3s}
.toast.show{transform:translateY(0);opacity:1}.toast i{color:var(--green);margin-right:7px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:6000;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}.modal{width:100%;max-width:650px;background:#0c1c2d;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.modal-body{padding:20px;color:#a9bdcf;font-size:10px;line-height:1.8}.close{background:none;border:0;color:#9ab0c4;font-size:18px}
@media(max-width:1450px){.grid6{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:repeat(2,1fr)}.pipeline{grid-template-columns:repeat(4,1fr)}}
@media(max-width:800px){
 .sidebar{width:65px}.brand h2,.brand p,.nav span,.label,.system{display:none}.brand{padding:15px 10px}.brand-row{justify-content:center}
 .nav a{justify-content:center}.main{margin-left:65px}.content{padding:15px}.header{padding:0 15px}.header p{display:none}.hero h2{font-size:25px}
 .grid6{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr}.sensor-grid{grid-template-columns:repeat(2,1fr)}.weather-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:500px){.grid6{grid-template-columns:1fr}.sensor-grid{grid-template-columns:1fr}.risk-panel{flex-direction:column;align-items:flex-start}.pipeline{grid-template-columns:repeat(2,1fr)}.live{display:none}}

/* ===== LOCATION + CHATBOT ADDITIONS ===== */
.location-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.location-search{position:relative;display:flex;align-items:center;flex:1;min-width:220px;max-width:520px}
.location-search>i{position:absolute;left:11px;color:#6f879c;font-size:10px;z-index:2}
.location-search input{width:100%;height:34px;padding:0 42px 0 31px;border-radius:8px;border:1px solid var(--line);outline:none;background:#0b1b2b;color:#eef6ff;font-size:9px}
.location-search input:focus{border-color:rgba(0,214,160,.45)}
.location-search-btn{position:absolute;right:4px;width:30px;height:26px;border:0;border-radius:6px;background:var(--green);color:#002219}
.location-suggestions{display:none;position:absolute;left:0;right:0;top:39px;z-index:2000;background:#0d2032;border:1px solid var(--line);border-radius:9px;overflow:hidden;box-shadow:var(--shadow)}
.location-suggestions.show{display:block}
.location-suggestion{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid rgba(255,255,255,.04);background:transparent;color:#cbd9e5;padding:9px 11px;font-size:9px}
.location-suggestion:hover{background:rgba(0,214,160,.08);color:#fff}
.location-suggestion small{display:block;color:#71879a;margin-top:3px}
.gps-btn{height:34px;color:var(--green);border-color:rgba(0,214,160,.28)}
.selected-location{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:8px 10px;margin-bottom:10px;background:rgba(78,161,255,.05);border:1px solid rgba(78,161,255,.12);border-radius:8px;color:#9eb4c7;font-size:8px}
.selected-location>i{color:var(--green)}
.gps-status{margin-left:auto;color:#6f879c}.gps-status.ok{color:var(--green)}.gps-status.error{color:#ff8995}
.chatbot-toggle{position:fixed;right:24px;bottom:24px;z-index:6500;width:52px;height:52px;border:1px solid rgba(0,214,160,.35);border-radius:50%;background:linear-gradient(135deg,var(--green),#159fd8);color:#002219;box-shadow:0 12px 35px rgba(0,0,0,.4);font-size:18px}
.chatbot-toggle:hover{transform:translateY(-2px)}
.chatbot{position:fixed;right:24px;bottom:88px;width:350px;max-width:calc(100vw - 30px);height:500px;z-index:6400;background:#0b1b2b;border:1px solid rgba(0,214,160,.2);border-radius:16px;box-shadow:0 25px 70px rgba(0,0,0,.5);display:none;overflow:hidden}
.chatbot.show{display:flex;flex-direction:column}
.chat-head{padding:13px 15px;background:linear-gradient(135deg,#0b3040,#10273c);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.chat-title{display:flex;gap:9px;align-items:center}.chat-avatar{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:rgba(0,214,160,.12);color:var(--green)}
.chat-title strong{display:block;font-size:10px}.chat-title small{display:block;color:#71879a;font-size:7px;margin-top:3px}
.chat-close{border:0;background:none;color:#8fa5b8;font-size:17px}
.chat-messages{flex:1;padding:13px;overflow:auto;display:flex;flex-direction:column;gap:9px}
.chat-msg{max-width:86%;padding:9px 10px;border-radius:10px;font-size:8px;line-height:1.55}
.chat-msg.bot{align-self:flex-start;background:#10283d;color:#c8d7e4;border:1px solid var(--line)}
.chat-msg.user{align-self:flex-end;background:rgba(0,214,160,.14);color:#e9fff9;border:1px solid rgba(0,214,160,.18)}
.chat-time{display:block;font-size:6px;color:#62798d;margin-top:4px}
.chat-quick{display:flex;gap:5px;flex-wrap:wrap;padding:0 11px 9px}
.chat-quick button{border:1px solid var(--line);background:#0d2235;color:#91a9bb;border-radius:15px;padding:6px 8px;font-size:7px}
.chat-input{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
.chat-input input{flex:1;min-width:0;border:1px solid var(--line);background:#081725;color:#fff;border-radius:8px;padding:9px;font-size:8px;outline:none}
.chat-send{width:36px;border:0;border-radius:8px;background:var(--green);color:#002219}
@media(max-width:500px){.chatbot{right:15px;bottom:78px;width:calc(100vw - 30px);height:460px}.chatbot-toggle{right:15px;bottom:15px}.gps-status{width:100%;margin-left:0}}

</style>
</head>
